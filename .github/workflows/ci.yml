name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '20'
            npm-version: '10'
          - node-version: '24'
            npm-version: '11'
          - node-version: '26'
            npm-version: '11'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Select npm version
        run: npm install --global npm@${{ matrix.npm-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run release readiness checks
        run: npm run release:readiness && npm run release:check

      - name: Reject deprecated runtime loader paths
        if: matrix.node-version == '26'
        run: npm run test:runtime-compat
